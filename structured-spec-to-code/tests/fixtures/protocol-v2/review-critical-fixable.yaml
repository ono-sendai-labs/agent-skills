acceptance_criteria:
  - text: config files are parsed into a typed structure
    status: pass
    evidence: tests/config_test.py:20 covers the parse path.
  - text: malformed config is rejected with a clear error
    status: pass
    evidence: tests/config_test.py:58 asserts the validation error.
findings:
  - severity: critical
    category: security
    file: src/config.py
    line: 44
    title: Config path interpolated into a shell command
    details: |
      src/config.py:44 builds a shell command by string interpolation of the
      user-supplied config path, allowing command injection.
    suggested_action: |
      Pass the path as an argument vector via subprocess.run([...]) instead of
      interpolating into a shell string, and add a test covering a path
      containing shell metacharacters.
